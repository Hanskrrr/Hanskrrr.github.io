<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a1942">
  <title>Hanskrrr · 页面不存在</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/config.js"></script>
  <script>
    (() => {
      let theme = null;
      try { theme = localStorage.getItem('gallery-theme'); } catch {}
      theme = theme || window.GALLERY_CONFIG.theme;
      if (['night', 'paper'].includes(theme)) document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/styles/blog.css">
  <script type="module" src="/blog/lost.js"></script>
</head>
<body>
  <main class="lost-page">
    <div class="lost-art" aria-hidden="true"></div>
    <p class="eyebrow">404</p>
    <h1>页面不存在</h1>
    <p class="muted">这个地址没有内容，可能已经移动或删除。</p>
    <div class="hero-actions">
      <a class="button button-primary" href="/">返回首页 <span aria-hidden="true">→</span></a>
      <a class="button" href="/terminal/"><span aria-hidden="true">›_</span> 终端</a>
    </div>
