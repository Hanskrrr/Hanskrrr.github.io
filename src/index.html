<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zespejo 的技术博客、项目与内容展示。">
  <meta name="theme-color" content="#1a1942">
  <title>Zespejo · 技术博客</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="Zespejo" href="/feed.xml">
  <script src="/config.js"></script>
  <script>
    (() => {
      const read = key => { try { return localStorage.getItem(key); } catch { return null; } };
      const root = document.documentElement;
      const config = window.GALLERY_CONFIG;
      const theme = read('gallery-theme') || config.theme;
      if (['night', 'paper'].includes(theme)) root.dataset.theme = theme;
      const terminalTheme = read('gallery-terminal-theme') || config.terminalTheme;
      root.dataset.terminalTheme = ['linux', 'blue', 'light'].includes(terminalTheme) ? terminalTheme : 'blue';
      const query = new URLSearchParams(location.search);
      const terminal = /^\/terminal\/?$/.test(location.pathname) ||
        (location.pathname === '/' && !query.has('view') && !query.has('article') && config.defaultView === 'terminal');
      if (terminal) root.dataset.view = 'terminal';
    })();
  </script>
  <link rel="stylesheet" href="/styles/blog.css">
  <link rel="stylesheet" href="/styles/terminal.css">
  <script type="module" src="/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="/?view=blog" data-nav="blog" aria-label="Zespejo 博客首页"><span class="brand-symbol" aria-hidden="true">H</span><span>Zespejo<span class="brand-sub">/ GALLERY</span></span></a>
      <nav aria-label="主导航"><a href="/?view=blog" data-nav="blog">文章</a><a href="/?view=graph" data-nav="graph">图谱</a><a href="/?view=about" data-nav="about">关于</a></nav>
      <button class="style-trigger" data-action="toggle-theme" aria-label="切换配色" title="切换配色"><span class="theme-dot" aria-hidden="true"></span></button>
    </header>
    <main id="main" tabindex="-1"><div class="loading" role="status">正在加载…</div></main>
    <footer class="site-footer"><span>© 2026 Zespejo</span><div><a href="https://github.com/Hanskrrr/Hanskrrr.github.io" target="_blank" rel="noreferrer">GitHub</a></div></footer>
  </div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <dialog id="photo-dialog" class="photo-dialog" aria-labelledby="photo-title"><div class="dialog-heading"><h2 id="photo-title">图片</h2><button class="icon-button" data-close="photo-dialog" aria-label="关闭图片">×</button></div><div id="photo-detail"></div></dialog>
  <noscript><p>文章可以直接阅读；终端和其他交互需要 JavaScript。</p></noscript>
</body>
</html>
