<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hanskrrr 的个人展览，收藏文字、影像与声音。">
    <meta name="color-scheme" content="dark">
    <title>Hanskrrr · Gallery</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #141817;
        color: #e6e9e2;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main { width: min(100%, 42rem); }
      .label {
        margin: 0 0 2rem;
        color: #a9bf95;
        font-size: .8rem;
        letter-spacing: .16em;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 4.5rem);
        font-weight: 500;
        letter-spacing: -.04em;
      }
      .description {
        margin: 1.25rem 0 3rem;
        color: #c2c9c1;
        line-height: 1.9;
      }
      .status {
        border-top: 1px solid #384139;
        padding-top: 1.25rem;
        color: #a9bf95;
        font-size: .9rem;
        line-height: 1.8;
      }
      .prompt { padding-right: .65rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">PERSONAL GALLERY / 001</p>
      <h1>Hanskrrr.</h1>
      <p class="description">文字、影像与声音。<br>这里是一处慢慢生长的个人展览。</p>
      <p class="status"><span class="prompt" aria-hidden="true">&gt;</span>正在布展，稍后见。</p>
    </main>
  </body>
</html>
