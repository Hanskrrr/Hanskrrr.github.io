<h2>保留稳定的参照</h2>
<p>浏览博客中的文章和项目时，顶栏和站点宽度保持一致。进入终端后，界面切换为全屏纯文本，使用短暂淡入淡出连接这两种浏览方式。</p>
<h2>控制变化的幅度</h2>
<p>动画用于说明状态变化。这个演示把切换控制在较短时间内，以透明度变化和少量纵向位移过渡。按钮只做轻微反馈；首页插画只有缓慢、低频的小动画，画面不在视野内或选择减少动态效果时会停下。</p>
<h2>动画不能成为操作门槛</h2>
<p>连续点击时，不应堆积一串等待播放的动画。浏览器不支持页面切换 API 时，仍然要正常完成导航；用户选择减少动态效果时，也应该尊重这一偏好。</p>
